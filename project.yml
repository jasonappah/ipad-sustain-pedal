name: IPadSustainPedal
options:
  minimumXcodeGenVersion: 2.46.0
settings:
  base:
    DEVELOPMENT_TEAM: 4DBK84V38Z
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 2
packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: 1.26.2
targets:
  IPadSustainPedal:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: IPadSustainPedal
        excludes:
          - Info.plist
    dependencies:
      - package: ComposableArchitecture
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: IPadSustainPedal/Info.plist
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: me.jasonaa.ipad-sustain-pedal
        PRODUCT_NAME: IPadSustainPedal
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_VISIONOS: NO
  IPadSustainPedalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: IPadSustainPedalTests
    dependencies:
      - target: IPadSustainPedal
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.jasonaa.ipad-sustain-pedal-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IPadSustainPedal.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/IPadSustainPedal"
schemes:
  IPadSustainPedal:
    build:
      targets:
        IPadSustainPedal: all
        IPadSustainPedalTests: [test]
    test:
      targets:
        - IPadSustainPedalTests
